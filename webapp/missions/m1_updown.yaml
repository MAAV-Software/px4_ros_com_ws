id: m1_updown
name: Climb and descend, one drone
spoken_name: up down
inputs: []
drones:
  drone1: {role: search}
launch:
  package: milestone1_singlevehicle
  file: offboard_solution.launch.py
  waypoints: {package: milestone1_singlevehicle, file: resource/milestone1_updown.yaml}
  # launch_sitl must stay false: stopping a launch that owns SITL also stops PX4.
  args: {launch_sitl: "false", record: "true", arm_delay_s: "10"}
