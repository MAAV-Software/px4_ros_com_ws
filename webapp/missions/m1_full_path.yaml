id: m1_full_path
name: Full test path, one drone
spoken_name: full path
inputs: []
drones:
  drone1: {role: search}
launch:
  package: milestone1_singlevehicle
  file: offboard_solution.launch.py
  waypoints: {package: milestone1_singlevehicle, file: resource/milestone1_path.yaml}
