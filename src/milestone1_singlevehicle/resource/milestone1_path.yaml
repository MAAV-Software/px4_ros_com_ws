# Milestone 1 waypoint path, loaded by offboard_control_solution.py at startup.
# The drone takes off to the first waypoint, flies them in order, then lands at the last.
# Coordinates are local NED frame, metres (x=north, y=east, z=down, so negative z is up).
waypoints:
  - [0.0, 0.0, -5.0]
  - [5.0, 0.0, -5.0]
  - [5.0, 5.0, -5.0]
  - [0.0, 5.0, -5.0]
